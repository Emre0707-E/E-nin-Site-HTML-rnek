<html lang="tr">
 <head>
  <title text="E-NİN SİTESİ">E-NİN SİTESİNE HOŞGELDİNİZ!</title>
 </head>
 <body style="margin: 0; min-height: 100vh; background-color: rgb(221, 197, 174);">
  <form action="kayit.html">
   <div style="font-family:'Times New Roman',Times,serif;color:#ad785f;display: flexbox; text-align:center;line-height:0.2px;letter-spacing:0.2px;font-size:18px;margin-top:14px;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;">
    <meta charset="UTF-8">
    <h3 style="color: #ad785f;">Hesap Ayarlarınız</h3>
    <label for="input1">Adınız:</label>
    <input id="input1" type="text" required; style="margin-bottom: -6px; color: #ad785f; background-color: #fad4bb; border-color: #d6a890; resize: none; width: 200px; height: 24;">
    <label for="input2">Soyadınız:</label>
    <input id="input2" type="text" required; style="margin-bottom: 10px; color: #ad785f; background-color: #fad4bb; border-color: #d6a890; resize: none; width: 200px; height: 24;">
    <label for="input3">Telefon Numaranız:</label>
    <input id="input3" type="text" required; style="margin-bottom: -6px; color: #ad785f; background-color: #fad4bb; border-color: #d6a890; resize: none; width: 200px; height: 24;">
    <label for="input4">E-Postanız:</label>
    <input id="input4" type="text" required; style="margin-bottom: -6px; color: #ad785f; background-color: #fad4bb; border-color: #d6a890; resize: none; width: 200px; height: 24;">
    <button type="reset"; style="color: #754f2c; background-color: #e08244; border-color: rgb(236, 180, 116); margin-top: 2px;">Sil</button>
    <button type="submit"; style="color: #754f2c; background-color: #e08244; border-color: rgb(236, 180, 116); margin-top: 2px;">Tamam</button>
   </div>
  </form>
 </body>
</html>
